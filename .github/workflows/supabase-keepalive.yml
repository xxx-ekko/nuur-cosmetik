# Les projets Supabase gratuits se mettent en pause après 7 jours sans activité.
# Ce petit job appelle la base tous les 3 jours pour la garder éveillée.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(sed -nE "s/.*supabaseUrl: *'([^']*)'.*/\1/p" assets/js/products.js)
          KEY=$(sed -nE "s/.*supabaseKey: *'([^']*)'.*/\1/p" assets/js/products.js)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Supabase n'est pas encore configuré dans assets/js/products.js : rien à faire."
            exit 0
          fi
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
